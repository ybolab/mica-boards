name: release
# The offline gates on every push; the pool -- every board package and
# every kernel archive -- and every board's bundle artifact are built and
# published to the registry by workflow_dispatch, with the deployment's
# trust certificates supplied as secrets, because a kernel built against a
# throwaway certificate is of no use to the assembly. Publishing is CI's:
# a developer machine builds and gates, and does not push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Everything is pushed to ONE package named after this repository,
# ghcr.io/ybolab/mica-boards, by this workflow's own token, with the artifact
# kind in the tag: pool.<arch>.build-<commit12> (every board package and
# kernel archive) and board.<board>.build-<commit12> (a board's bundle). The
# package is public, so the source pins are read with no token at all.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the source pins
        run: make deps
      - name: Lint, the kernel-config floor and the boards' tests
        run: make check
  release:
    # A build-<commit12> artifact is immutable and pinned by consumers, so only
    # a commit on main is published.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the source pins
        run: make deps
      - name: The trust certificates the kernels and U-Boot embed
        run: |
          set -euo pipefail
          mkdir -p meta/verity meta/boot
          printf '%s' "${{ secrets.MICA_VERITY_TRUST_CERT }}" | base64 -d > meta/verity/signer.cert.pem
          printf '%s' "${{ secrets.MICA_BOOT_TRUST_CERT }}" | base64 -d > meta/boot/signer.cert.pem
      - name: Emulation for the arm64 builds
        uses: docker/setup-qemu-action@v3
      - name: Builder images, both architectures
        run: |
          set -euo pipefail
          make build-env
          MICA_BUILD_PLATFORM=linux/arm64 make build-env
      - name: Every board's kernel and firmware
        run: |
          set -euo pipefail
          make kernels
          make firmware FIT_TRUST_CERT=../../meta/boot/signer.cert.pem
      - name: Pack, gate and publish
        run: |
          set -euo pipefail
          make pool
          make package-gate
          make publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
