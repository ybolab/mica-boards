# systemd-repart placeholder for uenv-a (partition 3).
#
# The 64 KiB entry is one half of the redundant U-Boot environment. This file
# holds position 3 in the board's linux-generic sequence so repart claims the
# existing partition instead of reclaiming or replacing it.
#
# SizeMinBytes=0 is load-bearing: repart's default 10 MiB minimum cannot match
# a 64 KiB partition and would make it try to create a replacement.
[Partition]
Type=linux-generic
SizeMinBytes=0
Weight=0
PaddingWeight=0
