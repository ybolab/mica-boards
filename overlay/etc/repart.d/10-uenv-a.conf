# systemd-repart placeholder for uenv-a (partition 2).
#
# repart pairs definition files with existing partitions by partition type
# UUID: the Nth file of a type matches the Nth on-disk partition of that type.
# Eight mos partitions share the linux-generic type, so every one of them needs
# a file in disk order or the single "grow" definition would attach itself to
# uenv-a. This file exists only to hold position 1 of 8 in that sequence.
#
# Weight=0 keeps it out of the free-space distribution, and repart never
# shrinks, moves or deletes an existing partition, so the definition is inert
# by construction. No size is pinned: the rootfs slot size is resolved by the
# image assembler, after this file has already been baked into the squashfs.
#
# SizeMinBytes=0 is load-bearing, not tidiness. systemd-repart refuses to CLAIM
# an existing partition smaller than the definition's minimum size, and that
# minimum DEFAULTS TO 10 MiB. uenv-a and uenv-b are 64 KiB, so with the default
# this definition could not pair with the partition it is standing in for:
# repart concluded it had to CREATE two new partitions, could not place them,
# and aborted the whole run with
#     Can't fit requested partitions into available free space (6.7G), refusing.
# before touching anything. The visible consequence was that /srv NEVER GREW on
# a real device, and it looked like a clean exit rather than a failure.
#
# Order matters if this is ever back-ported: while it was broken, this defect
# MASKED the loader-wipe hazard on mos, because repart aborted before it reached
# the discard. Fixing it on a layout WITHOUT the loader partition entry would
# un-mask a bootloader wipe. The loader partition exists now, so the
# fix is safe here; it must not travel without it.
[Partition]
Type=linux-generic
SizeMinBytes=0
Weight=0
PaddingWeight=0

# Moved out of the shared overlay when x64 arrived. systemd-repart matches
# definitions to existing partitions IN ORDER by Type, so a definition for a
# partition a board does not have shifts every later one onto the wrong
# partition -- and then creates new partitions for the definitions left over.
#
# Measured on the first x64 boot: repart reported "[OK] Finished", DATA did not
# grow, and two partitions named linux-generic and linux-generic-2 appeared,
# the second holding 2.1 GiB. Every step succeeded and the outcome was wrong.
