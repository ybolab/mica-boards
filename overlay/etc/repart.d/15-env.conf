# systemd-repart placeholder for the vendor env range (partition 2).
#
# This range remains vendor-owned even though mos replaces the bootloader: the
# vendor firmware writes it at a hardcoded offset. The definition only claims
# its position in the linux-generic sequence and never grows it.
#
# SizeMinBytes=0 is required because repart otherwise defaults to a 10 MiB
# minimum and refuses to pair this definition with the existing 8 MiB entry.
[Partition]
Type=linux-generic
SizeMinBytes=0
Weight=0
PaddingWeight=0
