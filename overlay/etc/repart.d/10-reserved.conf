# systemd-repart placeholder for the vendor reserved range (partition 1).
#
# Ten s905x5m partitions use the linux-generic type. repart pairs definition
# files with existing partitions of that type in disk order, so this inert file
# holds position 1 and prevents every later definition from shifting forward.
# The range is vendor-owned and must never grow or receive padding.
[Partition]
Type=linux-generic
Weight=0
PaddingWeight=0
