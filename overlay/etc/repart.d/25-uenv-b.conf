# systemd-repart placeholder for uenv-b (partition 4).
#
# The 64 KiB entry is the second half of the redundant U-Boot environment.
# This inert definition holds position 4 in the board's linux-generic sequence;
# the shared rootfs and data definitions follow it in disk order.
#
# SizeMinBytes=0 is load-bearing: repart's default 10 MiB minimum cannot match
# a 64 KiB partition and would make it try to create a replacement.
[Partition]
Type=linux-generic
SizeMinBytes=0
Weight=0
PaddingWeight=0
