;
; Private automatic configuration for the BM201 installer wrapper.
; The 8.3 filename is required by the vendor sdc_burn parser and deliberately
; avoids the magic aml_sdc_burn.ini name that triggers vendor autoburn.
; Not a general operator recipe. Keep this file ASCII-only.
;
[common]
erase_bootloader    = 1
erase_flash         = 1
reboot              = 3

[burn_ex]
package             = update.img
