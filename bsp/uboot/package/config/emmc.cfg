; Complete mos s905x5m eMMC USB-burning container.
;
; gpt is a vendor-special destination. It replaces the user-area partition
; table before the normal GPT names in LIST_VERIFY are written. bootloader and
; _aml_dtb are special destinations too: bootloader reaches the hardware boot
; area and _aml_dtb reaches reserved DTB storage, neither is a mos GPT entry.
;
; The normal entries supply the BootROM DDR stage and the burn-protocol U-Boot
; from the same DDR.USB file. With no usable DRAM at reset, both identities are
; required by the Amlogic USB flow.

[LIST_NORMAL]
file="DDR.USB"                main_type="USB"       sub_type="DDR"
file="DDR.USB"                main_type="USB"       sub_type="UBOOT"
file="aml_sdc_burn.UBOOT"     main_type="UBOOT"     sub_type="aml_sdc_burn"
file="aml_sdc_burn.ini"       main_type="ini"       sub_type="aml_sdc_burn"
file="gpt.bin"                main_type="bin"       sub_type="gpt"
file="_aml_dtb.PARTITION"     main_type="dtb"       sub_type="meson1"
file="platform.conf"          main_type="conf"      sub_type="platform"
file="usb_flow.aml"           main_type="aml"       sub_type="usb_flow"

[LIST_VERIFY]
file="_aml_dtb.PARTITION"     main_type="PARTITION" sub_type="_aml_dtb"
file="bootloader.PARTITION"   main_type="PARTITION" sub_type="bootloader"
file="uenv-a.PARTITION"       main_type="PARTITION" sub_type="uenv-a"
file="uenv-b.PARTITION"       main_type="PARTITION" sub_type="uenv-b"
file="boot-a.PARTITION"       main_type="PARTITION" sub_type="boot-a"
file="boot-b.PARTITION"       main_type="PARTITION" sub_type="boot-b"
file="rootfs-a.PARTITION"     main_type="PARTITION" sub_type="rootfs-a"
file="rootfs-b.PARTITION"     main_type="PARTITION" sub_type="rootfs-b"
file="meta.PARTITION"         main_type="PARTITION" sub_type="meta"
file="state.PARTITION"        main_type="PARTITION" sub_type="state"
file="ephemeral.PARTITION"    main_type="PARTITION" sub_type="ephemeral"
file="data.PARTITION"         main_type="PARTITION" sub_type="data"
