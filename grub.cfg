# GRUB configuration for the virt-arm64 slot pair (boards/virt-arm64/board.env).
#
# THE CONTRACT IS THE SAME ONE boards/cx3576/boot.cmd IMPLEMENTS FOR U-BOOT,
# and it is stated here so the two can be compared rather than trusted
# separately:
#
#   * RAUC picks the order and owns the counters. It writes ORDER, A_OK/A_TRY
#     and B_OK/B_TRY into grubenv with grub-editenv, exactly as the U-Boot
#     backend writes BOOT_ORDER and BOOT_A_LEFT into the redundant environment.
#   * The bootloader DECREMENTS before handing over, not after. A slot that
#     hangs before the health gate must lose an attempt, or a hang is a
#     permanent hang rather than one bad boot.
#   * The health gate resets the counter after a good boot. Nothing here does.
#
# RAUC is hardware-independent: the bundle, the slot model and the attempt
# contract are the same on both boards. This file exists because the STORAGE of
# those three variables differs -- grubenv here, a redundant U-Boot environment
# there -- and for no other reason.
#
# WHAT IS IN THIS FILE AND WHAT IS NOT.
#
# This file lives on the ESP -- the one partition the firmware boots and no
# code on the device can choose differently. So it holds ONLY board constants:
# which partition each slot is, and the fixed kernel arguments. It is written
# when the image is flashed and no update ever rewrites it.
#
# Everything that changes with a build -- the kernel and the dm-verity table
# with that rootfs's root hash -- lives on the SLOT'S OWN BOOT PARTITION, which
# RAUC installs as an ordinary vfat slot parented to the rootfs slot. GRUB can
# read any partition; it is only the firmware that cannot choose one, so the
# selection happens here instead.
#
# THERE IS NO `initrd` LINE IN EITHER MENUENTRY, and that is the boot contract
# rather than an omission. mos-kernel-virt-arm64 has CONFIG_DM_INIT, so the
# kernel's own dm-init reads the dm-mod.create= table below and builds
# /dev/dm-0 before the root mount -- exactly as cx3576's kernel does with the
# same string.
#
# This board has never loaded an initrd and the absence is why its kernel is
# built here rather than taken from Debian: linux-image-arm64 does not set
# CONFIG_DM_INIT, so it would accept the parameter below and ignore it
# silently, leaving no root at all. x64 shipped exactly that for a while and
# needed an initramfs whose local-top script re-parsed the line GRUB had just
# written -- a second implementation of this contract. PLAN-074 removed it
# there; this board is built so as never to acquire it.
#
# ONE ESP AND A BOOT PAIR, not two ESPs: with two, RAUC installs the payload
# into the inactive ESP -- never mounted, never searched -- so every update
# writes the new kernel and the new root hash where nothing reads them, leaves
# the read copy naming the old hash, and rolls back.

load_env

# Defaults for a factory image whose grubenv RAUC has never written.
if [ -z "${ORDER}" ]; then set ORDER="A B" ; fi
if [ -z "${A_OK}" ];  then set A_OK=0 ;     fi
if [ -z "${B_OK}" ];  then set B_OK=0 ;     fi
if [ -z "${A_TRY}" ]; then set A_TRY=0 ;    fi
if [ -z "${B_TRY}" ]; then set B_TRY=0 ;    fi

# A slot is bootable when RAUC marked it good, or when it still has an attempt
# left. `A_TRY=0` means "not yet tried this cycle", so the FIRST boot of a
# freshly installed slot is allowed and the second is not -- which is what
# makes a slot that cannot reach the health gate fall back rather than loop.
set default=0
set timeout=3

for SLOT in ${ORDER}; do
    if [ "${SLOT}" = "A" -a "${A_OK}" = "1" ]; then
        set fallback_slot="${fallback_slot} A"
    fi
    if [ "${SLOT}" = "B" -a "${B_OK}" = "1" ]; then
        set fallback_slot="${fallback_slot} B"
    fi
done

# THE SLOT'S OWN BOOT PARTITION, addressed relative to the ESP GRUB was loaded
# from. $root is the ESP, spelled "hd0,gpt1" or whatever the firmware handed
# over; taking the disk out of it and appending the slot's partition NUMBER
# means the slot partitions are found on the SAME disk, never on a USB stick
# that happened to enumerate first. The numbers are layout constants, rendered
# in at flash time.
#
# Not by filesystem label or volume id: a RAUC-installed slot carries whatever
# the bundle's mkfs.vfat wrote, and one bundle installs into either slot, so
# neither can identify which slot it landed in.
regexp --set=1:mos_disk '^(.*),gpt[0-9]+$' "${root}"
if [ -z "${mos_disk}" ]; then
    echo "cannot derive the disk from root='${root}'; the slot boot partitions cannot be addressed"
fi
set slot_a_root="${mos_disk},gpt@BOOT_A_PARTNUM@"
set slot_b_root="${mos_disk},gpt@BOOT_B_PARTNUM@"

# A slot whose boot partition has no command line is NOT booted with a partial
# one. Without the verity table the kernel has no root at all, so the failure
# would be a panic seconds later with nothing on the console explaining why --
# and an interrupted install is exactly when that happens. `false` fails the
# menuentry, which is what makes GRUB move on to the fallback slot.
menuentry "mos slot A" --id A {
    set MOS_ROOT_HASH=
    if [ -f (${slot_a_root})/cmdline.cfg ]; then
        source (${slot_a_root})/cmdline.cfg
    fi
    if [ -z "${MOS_ROOT_HASH}" ]; then
        echo "slot A: no usable cmdline.cfg on its boot partition -- refusing to boot it without a dm-verity table"
        false
    else
        if [ "${A_OK}" != "1" ]; then
            set A_TRY=1
            save_env A_TRY
        fi
        linux (${slot_a_root})/vmlinuz dm-mod.create="rootfs,,,ro,0 ${MOS_SECTORS} verity 1 PARTUUID=@ROOTFS_A_PARTUUID@ PARTUUID=@ROOTFS_A_PARTUUID@ ${MOS_DATA_BLOCK_SIZE} ${MOS_HASH_BLOCK_SIZE} ${MOS_DATA_BLOCKS} ${MOS_HASH_START_BLOCK} ${MOS_HASH_ALGO} ${MOS_ROOT_HASH} ${MOS_SALT}" dm-mod.waitfor=PARTUUID=@ROOTFS_A_PARTUUID@ root=/dev/dm-0 rootfstype=squashfs ro rootwait rauc.slot=A @BOARD_CMDLINE_ARGS@
    fi
}

menuentry "mos slot B" --id B {
    set MOS_ROOT_HASH=
    if [ -f (${slot_b_root})/cmdline.cfg ]; then
        source (${slot_b_root})/cmdline.cfg
    fi
    if [ -z "${MOS_ROOT_HASH}" ]; then
        echo "slot B: no usable cmdline.cfg on its boot partition -- refusing to boot it without a dm-verity table"
        false
    else
        if [ "${B_OK}" != "1" ]; then
            set B_TRY=1
            save_env B_TRY
        fi
        linux (${slot_b_root})/vmlinuz dm-mod.create="rootfs,,,ro,0 ${MOS_SECTORS} verity 1 PARTUUID=@ROOTFS_B_PARTUUID@ PARTUUID=@ROOTFS_B_PARTUUID@ ${MOS_DATA_BLOCK_SIZE} ${MOS_HASH_BLOCK_SIZE} ${MOS_DATA_BLOCKS} ${MOS_HASH_START_BLOCK} ${MOS_HASH_ALGO} ${MOS_ROOT_HASH} ${MOS_SALT}" dm-mod.waitfor=PARTUUID=@ROOTFS_B_PARTUUID@ root=/dev/dm-0 rootfstype=squashfs ro rootwait rauc.slot=B @BOARD_CMDLINE_ARGS@
    fi
}

# THE SELECTION, and it must actually read ORDER.
#
# A selection that only asks whether slot A should be SKIPPED and otherwise
# sets default=A ignores `ORDER="B A"` -- the one thing RAUC writes to say
# "boot the slot I just installed". A bundle then installs cleanly into B, RAUC
# sets ORDER=B A, the machine reboots into A, and every status command agrees
# the install succeeded.
#
# A slot is a candidate when RAUC marked it good, or when it has not been tried
# yet this cycle. ORDER decides which candidate is first; the other becomes
# GRUB's fallback, so a menuentry that fails outright still hands over.
set default=""
set fallback=""
for SLOT in ${ORDER}; do
    set slot_ok=0
    if [ "${SLOT}" = "A" -a "${A_OK}" = "1" ]; then set slot_ok=1; fi
    if [ "${SLOT}" = "A" -a "${A_TRY}" = "0" ]; then set slot_ok=1; fi
    if [ "${SLOT}" = "B" -a "${B_OK}" = "1" ]; then set slot_ok=1; fi
    if [ "${SLOT}" = "B" -a "${B_TRY}" = "0" ]; then set slot_ok=1; fi
    if [ "${slot_ok}" = "1" ]; then
        if [ -z "${default}" ]; then
            set default="${SLOT}"
        else
            if [ -z "${fallback}" ]; then set fallback="${SLOT}"; fi
        fi
    fi
done

# NEITHER slot is a candidate: both were tried and neither reached the health
# gate. Boot in ORDER anyway rather than sitting at a menu -- an appliance with
# no console is not helped by a prompt, and one more attempt at a slot that
# might come up beats a machine that certainly will not.
if [ -z "${default}" ]; then
    for SLOT in ${ORDER}; do
        if [ -z "${default}" ]; then
            set default="${SLOT}"
        else
            if [ -z "${fallback}" ]; then set fallback="${SLOT}"; fi
        fi
    done
fi
